<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- Fonts & Canvas Confetti -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100dvh;
            min-height: 100vh;
            font-family: 'Great Vibes', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #800020 0%, #4a0012 60%, #1a0006 100%);
            color: #ffffff;
            overflow: hidden;
            position: relative;
        }

        .main-wrapper {
            position: relative;
            width: 1000px;
            height: 580px;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-origin: center center;
            will-change: transform;
        }

        @keyframes scalePulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.04);
            }
        }

        /* --- SCREEN 1 --- */
        #screen1 {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 50;
            transition: all 0.5s ease;
        }

        .title-screen1 {
            font-size: 3.8rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.6);
            animation: scalePulse 3s ease-in-out infinite;
        }

        .envelope-init {
            width: 280px;
            height: 170px;
            background-color: #f7f5ed;
            position: relative;
            border-radius: 6px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            animation: scalePulse 2.5s ease-in-out infinite;
        }

        .flap-top {
            position: absolute;
            top: 0;
            left: 0;
            border-left: 140px solid transparent;
            border-right: 140px solid transparent;
            border-top: 100px solid #ece7d8;
            z-index: 1;
        }

        .flap-left {
            position: absolute;
            bottom: 0;
            left: 0;
            border-left: 140px solid #e2dcce;
            border-top: 85px solid transparent;
            border-bottom: 85px solid transparent;
            z-index: 2;
        }

        .flap-right {
            position: absolute;
            bottom: 0;
            right: 0;
            border-right: 140px solid #e2dcce;
            border-top: 85px solid transparent;
            border-bottom: 85px solid transparent;
            z-index: 2;
        }

        .flap-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            border-left: 140px solid transparent;
            border-right: 140px solid transparent;
            border-bottom: 95px solid #ebd8c8;
            z-index: 3;
        }

        .wax-seal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 48px;
            height: 48px;
            background: radial-gradient(circle at 30% 30%, #a81c3b, #4a0012 80%);
            border-radius: 50%;
            z-index: 4;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            border: 2px solid #800020;
        }

        .subtitle-screen1 {
            font-size: 2rem;
            margin-top: 20px;
            animation: scalePulse 2s ease-in-out infinite;
        }

        /* --- SCREEN 2 --- */
        #screen2 {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        #screen2.active {
            opacity: 1;
            pointer-events: auto;
        }

        .envelope-center {
            position: absolute;
            top: 150px;
            width: 420px;
            height: 260px;

            bottom: 0;
            left: 0;

            border-top: 130px solid transparent;
            border-bottom: 130px solid transparent;

        }

        .envelope-flap-right {
            position: absolute;
            bottom: 0;
            right: 0;
            border-right: 210px solid #d0c8b5;
            border-top: 130px solid transparent;
            border-bottom: 130px solid transparent;
            z-index: 11;
        }

        .envelope-flap-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            border-left: 210px solid transparent;
            border-right: 210px solid transparent;
            border-bottom: 145px solid #c7beab;
            z-index: 11;
        }

            height: 60px;
            background: radial-gradient(circle at 35% 35%, #a81c3b, #4a0012 80%);

            z-index: 13;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            border: 2px solid #800020;

        .photo-heart-wrapper {

            animation: heartLightPulse 2.5s ease-in-out infinite alternate;
        }

        @keyframes heartLightPulse {
            0% {
                transform: scale(1);
                opacity: 0.75;
            }

            100% {
                transform: scale(1.08);
                opacity: 1;
            }

        .photo-heart-container {
            position: relative;

            height: 100%;

            filter: drop-shadow(0px 12px 22px rgba(0, 0, 0, 0.7));

        .photo-heart-svg {
            width: 100%;
            height: 100%;

        .photo-polaroid {

            left: 70px;
            width: 210px;
            background: #ffffff;
            padding: 12px 12px 42px 12px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
            transform: rotate(-22deg);
            z-index: 15;
            border-radius: 2px;
        }

        .photo-polaroid img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }

        .photo-photostrip {
            position: absolute;

            border-radius: 2px;

        .photo-photostrip img {
            width: 100%;
            height: 125px;
            object-fit: cover;
            display: block;
        }

        /* --- DEKORASI FOTO --- */
        .emoji-deco {
            position: absolute;
            user-select: none;
            pointer-events: none;
            filter: drop-shadow(2px 6px 12px rgba(0, 0, 0, 0.6));
            border-radius: 8px;
            object-fit: cover;
            background: transparent;
            padding: 4px;

        .butterfly-1 {
            top: 250px;
            left: 180px;
            width: 290px;
            height: auto;
            z-index: 17;
            transform: rotate(-10deg);
        }

        .rose-1 {

        .rose-2 {

            height: auto;
            z-index: 16;
            transform: rotate(-12deg);
        }

        .flower-1 {
            top: 200px;
            right: 200px;
            width: 200px;
            height: auto;
            z-index: 16;
            transform: rotate(15deg);
        }

        .sparkle-1 {
            bottom: 130px;

            width: 285px;
            height: auto;
            z-index: 18;
            transform: rotate(-5deg);
        }

        .btn-surprise {
            position: absolute;
            bottom: 15px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: #ffffff;
            text-decoration: underline;
            cursor: pointer;
            z-index: 30;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.9);
            padding: 8px 16px;
        }

        .anim-item {
            opacity: 0;
            transform: scale(0.5) translateY(30px);
            transition: opacity 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .anim-item.show {
            opacity: 1;
        }

        .envelope-center.anim-item.show,
        .birthday-card.anim-item.show {
            transform: scale(1) translateY(0);
        }

        .photo-heart-wrapper.anim-item.show {
            transform: scale(1) rotate(-12deg);
        }

        .photo-polaroid.anim-item.show {
            transform: scale(1) rotate(-22deg);
        }

        .photo-photostrip.anim-item.show {
            transform: scale(1) rotate(18deg);
        }

        .butterfly-1.anim-item.show {
            animation: floatButterfly 3s ease-in-out infinite alternate;
        }

        .btn-surprise.anim-item.show {
            animation: scalePulse 2s ease-in-out infinite;
        }

        @keyframes floatButterfly {
            0% {
                transform: translateY(0) rotate(-10deg);
            }

            100% {
                transform: translateY(-8px) rotate(-16deg);
            }
        }

        /* --- SCREEN 3 --- */
        #screen3 {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: 60;

        #screen3.active {
            opacity: 1;
            pointer-events: auto;
        }

        .screen3-bg-photo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background-image: url('https://images.unsplash.com/photo-1519751138061-ce969af32125?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
            z-index: -1;
            mix-blend-mode: overlay;
            opacity: 0.4;
            pointer-events: none;
        }

        .title-screen3 {
            font-size: 4.8rem;
            color: #ffffff;
            margin-bottom: 50px;
            text-shadow: 0 0 15px rgba(168, 28, 59, 0.8), 2px 2px 10px rgba(0, 0, 0, 0.8);
            letter-spacing: 1px;
            z-index: 2;
        }

        .surprise-options {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 60px;
            width: 100%;
            max-width: 900px;
            z-index: 2;
        }

        .option-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .option-card:hover {
            transform: translateY(-12px) scale(1.1) !important;
        }

        .option-icon-box {
            position: relative;
            width: 130px;
            height: 130px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .option-icon-box::before {
            content: '';
            position: absolute;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.75) 0%, rgba(218, 165, 32, 0.35) 45%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            z-index: -1;
            filter: blur(14px);
            animation: auraPulse 2.8s infinite alternate ease-in-out;
        }

        .option-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: transparent;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.6));
            animation: floatAnimation 3.2s infinite ease-in-out;
        }

        .option-card:nth-child(1) .option-img {
            animation-delay: 0s;
        }

        .option-card:nth-child(2) .option-img {
            animation-delay: 0.5s;
        }

        .option-card:nth-child(3) .option-img {
            animation-delay: 1s;
        }

        @keyframes floatAnimation {
            0% {
                transform: translateY(0px) rotate(0deg);
            }

            50% {
                transform: translateY(-12px) rotate(2deg);
            }

            100% {
                transform: translateY(0px) rotate(0deg);
            }
        }

        @keyframes auraPulse {
            0% {
                transform: scale(0.85);
                opacity: 0.5;
            }

            100% {
                transform: scale(1.2);
                opacity: 0.95;
            }
        }

        .option-label {
            font-size: 2.8rem;
            color: #ffffff;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
            border-bottom: 2px solid rgba(255, 255, 255, 0.8);

        .anim-up {

        }

        .anim-up.show {

            line-height: 1.18;
            text-align: justify;
            white-space: pre-wrap;
        }

        .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 1.05rem;
            background-color: #800020;
            margin-left: 2px;
            animation: blinkCursor 0.6s infinite;
            vertical-align: middle;
        }

        @keyframes blinkCursor {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        .moment-deco-img {
            object-fit: contain;
            background: transparent;
            pointer-events: none;
            user-select: none;
        }

        .rose-cluster-left {
            position: absolute;

        .gold-frame-wrapper {

        .rose-sticker-frame {

            top: 100px;
            right: 25px;

            transform: rotate(10deg) scale(1);
        }

        /* --- PIRINGAN HITAM BERPUTAR --- */
        .circular-vinyl-player {
            position: absolute;
            bottom: -45px;
            left: 365px;
            width: 175px;
            height: 175px;
            border-radius: 50%;

            align-items: center;

        }

        .vinyl-spinning-disc {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;

                repeating-radial-gradient(circle, rgba(255, 255, 255, 0.03) 0px, rgba(255, 255, 255, 0.03) 2px, transparent 2px, transparent 5px),

                transform: rotate(360deg);

            opacity: 1;
            transform: translateY(0) scale(1);
        }
    </style>
</head>

    <script>
        /* --- SISTEM RESPONSIVE AUTO-SCALE --- */
        function adjustResponsiveScale() {
            const wrapper = document.getElementById('mainWrapper');
            if (!wrapper) return;

            const scaleX = window.innerWidth / 1000;
            const scaleY = window.innerHeight / 580;
            const scale = Math.min(scaleX, scaleY, 1.35);

            wrapper.style.transform = `scale(${scale})`;
        }

        window.addEventListener('resize', adjustResponsiveScale);
        window.addEventListener('orientationchange', () => setTimeout(adjustResponsiveScale, 150));
        document.addEventListener('DOMContentLoaded', adjustResponsiveScale);

        /* --- LOGIKA INTERAKSI & ANIMASI --- */
        const localVideo = document.getElementById('localVideo');
        const messageText = `"Selamat ulang tahun Loveeeee, semoga di umur yang semakinn sulit ini, kam semakinnn baikk dan tetap semangattt, jangan lupa sama orang tua dan takut akan Tuhan yaaaa. Makasi udah mau hadirr dihidupkuuu, karnaa kamm yang buat hidupkuu jadiii lebihhh bahagiiaaaa dann lebih baikkk, semoga kita kedepannya jadi lebih baik lagii dan bisa mengubah apa yang seharusnya kita ubahhh, aku juga berharap semoga di hari-hari dan juga ulang tahunndu selanjutnyaaa kitaa masiihh sama buat ngerayainnya yaaaaa. Maaf kaloo akuu banyak salah samanduu dan sering buat kam kesalll, tapi percaya lahhh aku selalu sayang samanduuu dann sayang selamanyaaaa. I love youuuuuuuu so muchhhhh waaaaaaaa, thank you for everythinggg."`;
        let typingTimeout = null;

        function openEnvelope() {
            const screen1 = document.getElementById('screen1');
            const screen2 = document.getElementById('screen2');
            const animItems = document.querySelectorAll('#screen2 .anim-item');

            screen1.style.opacity = '0';
            screen1.style.transform = 'scale(0.8)';
            screen1.style.pointerEvents = 'none';

            setTimeout(() => {
                screen1.style.display = 'none';
                screen2.classList.add('active');

                animItems.forEach((item, index) => {
                    setTimeout(() => item.classList.add('show'), index * 180);
                });
            }, 500);
        }

        function goToScreen3() {
            const screen2 = document.getElementById('screen2');
            const screen3 = document.getElementById('screen3');
            const animUpItems = document.querySelectorAll('#screen3 .anim-up');

            screen2.style.opacity = '0';
            screen2.style.pointerEvents = 'none';

            setTimeout(() => {
                screen2.style.display = 'none';
                screen3.style.display = 'flex';
                screen3.style.opacity = '1';
                screen3.style.pointerEvents = 'auto';
                screen3.classList.add('active');

                animUpItems.forEach((item, index) => {
                    setTimeout(() => item.classList.add('show'), index * 150);
                });

                confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
            }, 500);
        }

        function goToJourneyGallery() {
            const screen3 = document.getElementById('screen3');
            const screen4 = document.getElementById('screen4');
            const journeyItems = document.querySelectorAll('#screen4 .journey-item');

            screen3.style.opacity = '0';
            screen3.style.pointerEvents = 'none';

            setTimeout(() => {
                screen3.classList.remove('active');
                screen3.style.display = 'none';

                screen4.style.display = 'flex';
                screen4.style.opacity = '1';
                screen4.style.pointerEvents = 'auto';
                screen4.classList.add('active');

                journeyItems.forEach(item => item.classList.remove('show'));

                requestAnimationFrame(() => {
                    journeyItems.forEach((item, index) => {
                        setTimeout(() => item.classList.add('show'), index * 150);
                    });
                });

                confetti({ particleCount: 120, spread: 90, origin: { y: 0.5 } });
            }, 500);
        }

        function goToMomentScreen() {
            const screen3 = document.getElementById('screen3');
            const screen5 = document.getElementById('screen5');
            const momentItems = document.querySelectorAll('#screen5 .moment-item');
            const typedTarget = document.getElementById('typedTarget');

            screen3.style.opacity = '0';
            screen3.style.pointerEvents = 'none';

            setTimeout(() => {
                screen3.classList.remove('active');
                screen3.style.display = 'none';

                screen5.style.display = 'flex';
                screen5.style.opacity = '1';
                screen5.style.pointerEvents = 'auto';
                screen5.classList.add('active');

                momentItems.forEach(item => item.classList.remove('show'));
                typedTarget.innerHTML = '';
                if (typingTimeout) clearTimeout(typingTimeout);

                requestAnimationFrame(() => {
                    momentItems.forEach((item, index) => {
                        setTimeout(() => item.classList.add('show'), index * 150);
                    });

                    setTimeout(() => startTypingAnimation(messageText, typedTarget), 400);
                });

                confetti({ particleCount: 100, spread: 80, origin: { y: 0.6 } });
            }, 500);
        }

        function goToPlaylistScreen() {
            const screen3 = document.getElementById('screen3');
            const screen6 = document.getElementById('screen6');
            const playlistItems = document.querySelectorAll('#screen6 .playlist-item');

            screen3.style.opacity = '0';
            screen3.style.pointerEvents = 'none';

            setTimeout(() => {
                screen3.classList.remove('active');
                screen3.style.display = 'none';

                screen6.style.display = 'flex';
                screen6.style.opacity = '1';
                screen6.style.pointerEvents = 'auto';
                screen6.classList.add('active');

                playlistItems.forEach(item => item.classList.remove('show'));

                requestAnimationFrame(() => {
                    playlistItems.forEach((item, index) => {
                        setTimeout(() => item.classList.add('show'), index * 150);
                    });
                });

                confetti({ particleCount: 100, spread: 80, origin: { y: 0.6 } });
            }, 500);
        }

        function startTypingAnimation(text, element) {
            let i = 0;
            element.innerHTML = '<span class="typing-cursor"></span>';

            function typeChar() {
                if (i < text.length) {
                    element.innerHTML = text.substring(0, i + 1) + '<span class="typing-cursor"></span>';
                    i++;
                    typingTimeout = setTimeout(typeChar, 18);
                }
            }
            typeChar();
        }

        function backToScreen3From(currentScreenId) {
            const screen3 = document.getElementById('screen3');
            const currentScreen = document.getElementById(currentScreenId);

            if (currentScreenId === 'screen4') {
                document.querySelectorAll('#screen4 .journey-item').forEach(item => item.classList.remove('show'));
            } else if (currentScreenId === 'screen5') {
                document.querySelectorAll('#screen5 .moment-item').forEach(item => item.classList.remove('show'));
                if (typingTimeout) clearTimeout(typingTimeout);
                document.getElementById('typedTarget').innerHTML = '';
            } else if (currentScreenId === 'screen6') {
                document.querySelectorAll('#screen6 .playlist-item').forEach(item => item.classList.remove('show'));
                if (localVideo) {
                    localVideo.pause();
                    localVideo.currentTime = 0;
                }
            }

            currentScreen.style.opacity = '0';
            currentScreen.style.pointerEvents = 'none';

            setTimeout(() => {
                currentScreen.classList.remove('active');
                currentScreen.style.display = 'none';

                screen3.style.display = 'flex';
                screen3.style.opacity = '1';
                screen3.style.pointerEvents = 'auto';
                screen3.classList.add('active');

                const optionImages = document.querySelectorAll('#screen3 .option-img');
                const optionAuras = document.querySelectorAll('#screen3 .option-icon-box');

                optionImages.forEach((img) => {
                    img.style.animation = 'none';
                    img.offsetHeight;
                    img.style.animation = '';
                });

                optionAuras.forEach((aura) => {
                    aura.style.animation = 'none';
                    aura.offsetHeight;
                    aura.style.animation = '';
                });
            }, 500);
        }
    </script>
